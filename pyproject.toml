[project]
name = "pfun-llm"
version = "0.1.6"
description = "LLM backend interfaces for pfun."
readme = "README.md"
requires-python = ">=3.11, <3.13"

dependencies = [
  "pfun-common"
]

[project.urls]
Homepage = "https://github.com/pfun-health/pfun-llm"
Documentation = "https://pfun-health.github.io/pfun-llm/"
Repository = "https://github.com/pfun-health/pfun-llm"
Issues = "https://github.com/pfun-health/pfun-llm/issues"
Changelog = "https://pfun-health.github.io/pfun-llm/release-notes/"

[project.optional-dependencies]
# dev/test dependencies
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "ipython>=9.17.1"
]
# ollama-related dependencies
ollama = [
  "ollama==0.6.1",
]
# Google-related dependencies
google = [
  "google==3.0.0",
  "google-genai==1.57.0",
]
# Perplexity-related dependencies
perplexity = [
    "perplexityai>=0.22.0",
]

[tool.uv.sources]
pfun-common = { git = "https://github.com/pfun-health/pfun-common" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--tb=short --durations=5"
asyncio_mode = "auto"

